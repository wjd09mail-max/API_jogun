name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk StockAlert-v1.${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockAlert-apk
          path: StockAlert-v1.${{ github.run_number }}.apk

      - name: Publish release (폰에서 바로 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: 조건검색 알림 v1.${{ github.run_number }}
          body: 아래 Assets 에서 .apk 파일을 휴대폰으로 내려받아 설치하세요.
          files: StockAlert-v1.${{ github.run_number }}.apk
